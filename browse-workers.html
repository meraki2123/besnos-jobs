
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Workers - Besnos Jobs</title>

    <meta name="description"
          content="Find workers by job category and location with Besnos Jobs.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav>
        <h2>Besnos Jobs</h2>

        <div>
            <a href="index.html"
               data-en="Home"
               data-am="መነሻ">Home</a>

            <a href="browse-workers.html"
               data-en="Find Workers"
               data-am="ሰራተኞችን ይፈልጉ">Find Workers</a>

            <a href="worker.html"
               data-en="Register as a Worker"
               data-am="እንደ ሰራተኛ ይመዝገቡ">Register as a Worker</a>

            <a href="check-status.html"
               data-en="Check Status"
               data-am="ሁኔታን ይመልከቱ">Check Status</a>

            <button
                type="button"
                id="languageButton"
                onclick="toggleLanguage()">
                አማርኛ
            </button>
        </div>
    </nav>


    <!-- HERO -->
    <section class="hero">
        <h1
            data-en="Find a Worker"
            data-am="ሰራተኛ ያግኙ">
            Find a Worker
        </h1>

        <p
            data-en="Find workers by location and job type."
            data-am="ሰራተኞችን በአካባቢ እና በስራ አይነት ይፈልጉ።">
            Find workers by location and job type.
        </p>
    </section>


    <!-- SEARCH -->
    <section class="search">

        <h2
            data-en="Search Workers"
            data-am="ሰራተኞችን ይፈልጉ">
            Search Workers
        </h2>

        <form id="workerSearchForm">

            <!-- LOCATION -->
            <input
                type="text"
                id="locationSearch"
                name="location"
                placeholder="Search by city or location"
                data-placeholder-en="Search by city or location"
                data-placeholder-am="በከተማ ወይም በአካባቢ ይፈልጉ"
                aria-label="Search by city or location">

            <!-- JOB TYPE -->
            <select
                id="jobSearch"
                name="job"
                aria-label="Select job category">

                <option
                    value="All Jobs"
                    data-en="All Jobs"
                    data-am="ሁሉም ስራዎች">
                    All Jobs
                </option>

                <option value="Nanny"
                        data-en="Nanny"
                        data-am="ሞግዚት">
                    Nanny
                </option>

                <option value="Cleaner"
                        data-en="Cleaner"
                        data-am="ጽዳት ሰራተኛ">
                    Cleaner
                </option>

                <option value="Driver"
                        data-en="Driver"
                        data-am="ሹፌር">
                    Driver
                </option>

                <option value="Cook"
                        data-en="Cook"
                        data-am="ምግብ አብሳይ">
                    Cook
                </option>

                <option value="Security Guard"
                        data-en="Security Guard"
                        data-am="ጥበቃ ሰራተኛ">
                    Security Guard
                </option>

                <option value="Gardener"
                        data-en="Gardener"
                        data-am="አትክልተኛ">
                    Gardener
                </option>

                <option value="Caregiver"
                        data-en="Caregiver"
                        data-am="ተንከባካቢ">
                    Caregiver
                </option>

            </select>

            <!-- SEARCH BUTTON -->
            <button type="submit">
                <span
                    data-en="Search"
                    data-am="ፈልግ">
                    Search
                </span>
            </button>

        </form>
    </section>


    <!-- WORKER RESULTS -->
    <section
        class="cards"
        id="publicWorkers"
        aria-live="polite"
        aria-label="Worker search results">

        <h3
            data-en="Loading workers..."
            data-am="ሰራተኞች በመጫን ላይ...">
            Loading workers...
        </h3>

    </section>


    <!-- FOOTER -->
    <footer>
        <p
            data-en="© 2026 Besnos Jobs"
            data-am="© 2026 Besnos Jobs">
            © 2026 Besnos Jobs
        </p>
    </footer>


    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="firebase.js"></script>
    <script src="script.js"></script>


    <!-- SEARCH FORM HANDLER -->
    <script>
        const workerSearchForm =
            document.getElementById("workerSearchForm");

        workerSearchForm.addEventListener("submit", function(event) {
            event.preventDefault();

            if (typeof searchWorkers === "function") {
                searchWorkers();
            } else {
                console.error(
                    "searchWorkers() was not found in script.js."
                );
            }
        });
    </script>


    <!-- LANGUAGE SWITCHER -->
    <script>
        let currentLanguage =
            localStorage.getItem("besnosLanguage") || "en";

        function setLanguage(language) {
            currentLanguage = language;

            localStorage.setItem("besnosLanguage", language);

            document.querySelectorAll("[data-en][data-am]")
                .forEach(function(element) {
                    element.textContent =
                        element.getAttribute("data-" + language);
                });

            document.querySelectorAll(
                "[data-placeholder-en][data-placeholder-am]"
            ).forEach(function(element) {
                element.placeholder =
                    element.getAttribute(
                        "data-placeholder-" + language
                    );
            });

            const languageButton =
                document.getElementById("languageButton");

            if (languageButton) {
                languageButton.textContent =
                    language === "en" ? "አማርኛ" : "English";
            }

            document.documentElement.lang =
                language === "am" ? "am" : "en";
        }

        function toggleLanguage() {
            setLanguage(
                currentLanguage === "en" ? "am" : "en"
            );
        }

        setLanguage(currentLanguage);
    </script>

</body>
</html>
